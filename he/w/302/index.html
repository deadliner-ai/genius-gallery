<h1>רוח נאה, בוקר צלול</h1>
<p class="by">קצושיקה הוקוסאי, 1830</p>
<p class="line">לא הר, אלא הדקות הספורות שבהן ההר מאדים.</p>
<p class="story">שלושה צבעים, כמעט בלי פרטים, והר שמאדים לכמה דקות בבקרים של סוף הקיץ. הוקוסאי לא צייר הר; הוא צייר רגע.</p>
